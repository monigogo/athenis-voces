name: ⛔ Fix Error Request
description: Report an error that needs to be fixed
title: "[Fix]: "
labels: ["bug"]

body:
  - type: textarea
    id: description
    attributes:
      label: Detailed description
      description: What is failing?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. ...
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - High
        - Medium
        - Low
    validations:
      required: true
