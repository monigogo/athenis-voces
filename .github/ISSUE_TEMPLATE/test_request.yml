name: 🚧 Test Request
description: Add or fix tests
title: "[Test]: "
labels: ["test"]

body:
  - type: textarea
    id: description
    attributes:
      label: Detailed description
      description: Which module or behavior should the tests cover?
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - High
        - Medium
        - Low
    validations:
      required: true
