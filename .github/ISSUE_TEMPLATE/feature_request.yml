name: 🧩 Feature Request
description: Suggest new project functionality
title: "[Feature]: "
labels: ["enhancement"]

body:
  - type: textarea
    id: description
    attributes:
      label: Detailed description
      description: What does it do? Why is it useful for the challenge?
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Definition of done
      description: How will we know it is finished?
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - High
        - Medium
        - Low
    validations:
      required: true
