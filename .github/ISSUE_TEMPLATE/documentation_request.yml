name: 📚 Documentation Request
description: Add or update documentation
title: "[Documentation]: "
labels: ["documentation"]

body:
  - type: textarea
    id: description
    attributes:
      label: Detailed description
      description: What needs to be documented or updated?
    validations:
      required: true

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      options:
        - High
        - Medium
        - Low
    validations:
      required: true

