version: 2

updates:
  - package-ecosystem: "uv"
    directory: "/backend"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    groups:
      uv-deps:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Las versiones mayores rompen la configuración (p. ej. Biome 2): se suben a mano
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # torch y torchaudio están fijados en 2.11.0: la GPU V100S no admite versiones posteriores
      - dependency-name: "torch"
      - dependency-name: "torchaudio"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(ci)"
    ignore:
      # Las versiones mayores rompen la configuración (p. ej. Biome 2): se suben a mano
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "npm"
    directory: "/frontend"
    target-branch: "develop"
    schedule:
      interval: "monthly"
    groups:
      npm-deps:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # Las versiones mayores rompen la configuración (p. ej. Biome 2): se suben a mano
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
