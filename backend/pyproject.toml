[project]
name = "athenis-backend"
version = "0.1.0"
description = "Backend for the Women in Open AI challenge"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.14.1",
]

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=8.0",
    "ruff>=0.6",
]
audio = [
    "pyannote.audio",
    "inaSpeechSegmenter",
    # La V100S de OVH tiene capacidad 7.0: la 2.14.1 falla por su cuDNN (C6, R3)
    "torch==2.11.0",
    "torchaudio==2.11.0",
]
evaluacion = [
    "pyannote-metrics>=4.2.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: tests lentos que necesitan los modelos reales y el grupo audio",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["EXE002"]  # Windows mounts make every file look executable

