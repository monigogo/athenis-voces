[project]
name = "athenis-backend"
version = "0.1.0"
description = "Backend de athenis-voces para el reto Women in Open AI"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "pydantic>=2.14.1",
    "python-multipart>=0.0.32",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "httpx>=0.28.1",
    "pip-audit>=2.10.1",
    "pip-licenses>=5.5.5",
    "pre-commit>=4.7.0",
    "pytest>=8.0",
    "ruff>=0.6",
]
audio = [
    "pyannote.audio>=4.0",  # el código usa la API de la 4: token= y speaker_diarization
    "inaSpeechSegmenter>=0.8",
    # La V100S de OVH tiene capacidad 7.0: la 2.14.1 falla por su cuDNN (C6, R3)
    "torch==2.11.0",
    "torchaudio==2.11.0",
]
evaluacion = [
    "pyannote-metrics>=4.2.0",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "slow: tests lentos que necesitan los modelos reales y el grupo audio",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["EXE002"]  # Windows mounts make every file look executable

