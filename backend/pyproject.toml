[project]
name = "athenis-backend"
version = "0.1.0"
description = "Backend for the Women in Open AI challenge"
requires-python = ">=3.11"
dependencies = []

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
ignore = ["EXE002"]  # Windows mounts make every file look executable

